name: Daily Database Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC (7:00 AM Pakistan time)
  workflow_dispatch:  # Allows manual trigger from GitHub's Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create backup
        run: |
          pg_dump "${{ secrets.DATABASE_URL }}" > backup-$(date +%F).sql

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 90  # Keeps backups for 90 days
